<!doctype html>
<html>
<head>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
</head>

<body>
  <h3>Attachments Downloader</h3>

  <button onclick="authorize()">Authorize</button>
  <br><br>

  <button onclick="download()">Download Attachments</button>

  <p id="status"></p>

  <script>
    const t = TrelloPowerUp.iframe({
      appKey: "4a96c23ac4cd6f8f9088b53390018b74",
      appName: "Attachments Downloader"
    });

    async function authorize() {
      try {
        await t.getRestApi().authorize({
          scope: 'read',
          expiration: 'never'
        });
        document.getElementById("status").innerText = "Authorized ✅";
      } catch (e) {
        console.error(e);
      }
    }

    async function download() {
      const status = document.getElementById("status");

      try {
        status.innerText = "Getting access...";

        let token = await t.getRestApi().getToken();

        if (!token) {
          status.innerText = "Click Authorize first ⚠️";
          return;
        }

        const board = await t.board("id");

        status.innerText = "Fetching cards...";

        const response = await fetch(
          `https://api.trello.com/1/boards/${board.id}/cards?attachments=true&key=4a96c23ac4cd6f8f9088b53390018b74&token=${token}`
        );

        const cards = await response.json();

        let attachments = [];

        for (let card of cards) {
          if (card.attachments && card.attachments.length > 0) {
            for (let att of card.attachments) {
              attachments.push(att);
            }
          }
        }

        if (attachments.length === 0) {
          status.innerText = "No attachments found ❌";
          return;
        }

        status.innerText = `Downloading ${attachments.length} files...`;

        const zip = new JSZip();
        let success = 0;

        for (let file of attachments) {
          try {
            const res = await fetch(t.signUrl(file.url));
            const blob = await res.blob();
            zip.file(file.name, blob);
            success++;
          } catch (e) {
            console.log("Skipped:", file.name);
          }
        }

        status.innerText = "Creating ZIP...";

        const content = await zip.generateAsync({ type: "blob" });

        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = "attachments.zip";
        a.click();

        status.innerText = `Downloaded ${success} files ✅`;

      } catch (err) {
        console.error(err);
        status.innerText = err.message || "Error occurred ❌";
      }
    }
  </script>
</body>
</html>
